name: KiCad analysis companion

on:
  pull_request:
    paths:
      - "integrations/kicad-analysis-server/**"
      - ".github/workflows/analysis-companion.yml"
  push:
    branches: [main]
    paths:
      - "integrations/kicad-analysis-server/**"
      - ".github/workflows/analysis-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/kicad-analysis-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: integrations/kicad-analysis-server/pyproject.toml
      - name: Install companion and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-test.txt
      - name: Run companion tests
        run: |
          python -m pytest tests/test_parser_models.py -v
          python -m compileall -q src

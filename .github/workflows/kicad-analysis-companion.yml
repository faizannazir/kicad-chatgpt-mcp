name: KiCad analysis companion

on:
  push:
    paths:
      - "integrations/kicad-analysis-server/**"
      - ".github/workflows/kicad-analysis-companion.yml"
  pull_request:
    paths:
      - "integrations/kicad-analysis-server/**"
      - ".github/workflows/kicad-analysis-companion.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: integrations/kicad-analysis-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run parser and tool tests
        run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Lint companion source and tests
        run: ruff check integrations/kicad-analysis-server/src integrations/kicad-analysis-server/tests

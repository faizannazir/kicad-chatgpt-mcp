name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typescript:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile
        run: npm run build
      - name: TypeScript test placeholder
        run: npm run test:ts

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
          python -m pip install -r python/requirements.txt
      - name: Run Python tests
        run: python -m pytest --import-mode=importlib tests/ python/tests/ -q

  python-lint:
    name: Python lint (changed files)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint tools
        run: python -m pip install black flake8
      - name: Check changed Python files only
        shell: bash
        run: |
          changed="$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.py')"
          if [ -z "$changed" ]; then
            echo "No Python files changed."
            exit 0
          fi
          echo "$changed" | xargs black --check
          echo "$changed" | xargs flake8 --select=E,F,W --extend-ignore=E501

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # TypeScript/Node.js tests
  typescript-tests:
    name: TypeScript Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # npm run lint also invokes Black, MyPy and Flake8 for python/.
      # Install Python and those tools on every OS in this matrix (including Windows).
      - name: Setup Python for lint
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test and lint dependencies
        run: |
          python -m pip install --upgrade black mypy flake8 pytest pytest-cov
          python -m pip install -r requirements.txt

      - name: Run TypeScript compiler
        run: npm run build

      - name: Run TypeScript lint
        run: npm run lint:ts

      - name: Run tests
        run: npm test

  # Python style checks are intentionally separate from mypy. The imported
  # companion and legacy Python bridge still contain untyped KiCad/SWIG APIs.
  python-style:
    name: Python Style (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install style tools
        run: python -m pip install black flake8
      - name: Check formatting and lint only changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -t files < <(git diff --name-only "$BASE_SHA" HEAD -- python/ | grep -E '\\.py

  # Python tests
  python-tests:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov black mypy pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Black formatter check
        run: black --check python/ || echo "Black not configured yet"

      - name: Run MyPy type checker
        run: mypy python/ || echo "MyPy not configured yet"

      - name: Run Pylint
        run: pylint python/ || echo "Pylint not configured yet"

      - name: Run pytest
        run: pytest python/ --cov=python --cov-report=xml || echo "Tests not configured yet"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: python
          name: python-${{ matrix.python-version }}
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-24.04'

  # Integration tests (requires KiCAD)
  integration-tests:
    name: Integration Tests (Linux + KiCAD)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Add KiCAD PPA and Install KiCAD 9.0
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad kicad-libraries

      - name: Verify KiCAD installation
        run: |
          kicad-cli version || echo "kicad-cli not found"
          python3 -c "import pcbnew; print(f'pcbnew version: {pcbnew.GetBuildVersion()}')" || echo "pcbnew module not found"

      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Build TypeScript
        run: npm run build

      - name: Run integration tests
        run: |
          echo "Integration tests not yet configured"
          # pytest tests/integration/

  # Docker build test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          echo "Docker build not yet configured"
          # docker build -t kicad-mcp-server:test .

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ || echo "ESLint not configured yet"

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.ts" || echo "Prettier not configured yet"

      - name: Check for security vulnerabilities
        run: npm audit --audit-level=moderate || echo "No critical vulnerabilities"

  # Documentation check
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README exists
        run: test -f README.md

      - name: Check for broken links in docs
        run: |
          sudo apt-get install -y linkchecker || true
          # linkchecker docs/ || echo "Link checker not configured"

      - name: Validate JSON files
        run: |
          find . -name "*.json" -not -path "./node_modules/*" -not -path "./dist/*" | xargs -I {} sh -c 'python3 -m json.tool {} > /dev/null && echo "✓ {}" || echo "✗ {}"'
 || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files changed; skipping legacy Python formatting checks."
            exit 0
          fi
          black --check "${files[@]}"
          flake8 "${files[@]}" --select=E,F,W --extend-ignore=E501

  # Python tests
  python-tests:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov black mypy pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Black formatter check
        run: black --check python/ || echo "Black not configured yet"

      - name: Run MyPy type checker
        run: mypy python/ || echo "MyPy not configured yet"

      - name: Run Pylint
        run: pylint python/ || echo "Pylint not configured yet"

      - name: Run pytest
        run: pytest python/ --cov=python --cov-report=xml || echo "Tests not configured yet"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: python
          name: python-${{ matrix.python-version }}
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-24.04'

  # Integration tests (requires KiCAD)
  integration-tests:
    name: Integration Tests (Linux + KiCAD)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Add KiCAD PPA and Install KiCAD 9.0
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad kicad-libraries

      - name: Verify KiCAD installation
        run: |
          kicad-cli version || echo "kicad-cli not found"
          python3 -c "import pcbnew; print(f'pcbnew version: {pcbnew.GetBuildVersion()}')" || echo "pcbnew module not found"

      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Build TypeScript
        run: npm run build

      - name: Run integration tests
        run: |
          echo "Integration tests not yet configured"
          # pytest tests/integration/

  # Docker build test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          echo "Docker build not yet configured"
          # docker build -t kicad-mcp-server:test .

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ || echo "ESLint not configured yet"

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.ts" || echo "Prettier not configured yet"

      - name: Check for security vulnerabilities
        run: npm audit --audit-level=moderate || echo "No critical vulnerabilities"

  # Documentation check
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README exists
        run: test -f README.md

      - name: Check for broken links in docs
        run: |
          sudo apt-get install -y linkchecker || true
          # linkchecker docs/ || echo "Link checker not configured"

      - name: Validate JSON files
        run: |
          find . -name "*.json" -not -path "./node_modules/*" -not -path "./dist/*" | xargs -I {} sh -c 'python3 -m json.tool {} > /dev/null && echo "✓ {}" || echo "✗ {}"'
